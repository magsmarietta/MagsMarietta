<script>
// ── Populate the Great Deals grid ──────────
(function () {
  if (typeof PRODUCTS === 'undefined') return;

  function makeCard(p) {
    const card = document.createElement('a');
    card.className  = 'product-card';
    card.href       = `product.html?id=${p.id}`;
    card.title      = p.name;
    card.style.cssText = 'display:block;text-decoration:none;color:inherit;overflow:visible;position:relative;';

    const imgHTML = p.thumbnail
      ? `<img src="${p.thumbnail}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--radius);">`
      : `<div class="pixel-art-slot"><span>pixel art</span></div>`;

    card.innerHTML = `
      <div class="product-price">$${p.price.toFixed(2)}</div>
      ${imgHTML}
      <div class="product-label">${p.name}</div>`;
    return card;
  }

  const dealsGrid = document.getElementById('deals-grid');
  if (dealsGrid) PRODUCTS.filter(p => p.deal).forEach(p => dealsGrid.appendChild(makeCard(p)));
})();
</script>
<script>
// ── Render the checkout page from the stored cart ──────────
(function () {
  const app = document.getElementById('checkout-app');
  if (!app) return;

  // Pricing constants — tune these as your real costs firm up.
  // TAX_RATE: combined CA/Walnut Creek sales tax on the item subtotal (confirm current rate at cdtfa.ca.gov)
  // SHIPPING_FLAT_FEE: flat estimated cost to ship a finished order to the customer (e.g. via UPS)
  const TAX_RATE          = 0.0925;
  const SHIPPING_FLAT_FEE = 9.00;

  function render() {
    const cart = getCart();

    if (cart.length === 0) {
      app.innerHTML = `
        <div class="panel">
          <div class="panel-title"><img src="images/icon-cart.webp" alt="" class="panel-icon"> Checkout</div>
          <div class="panel-body appraisal-text">
            <p style="text-align:center;">Your cart is empty.</p>
            <p style="text-align:center;"><a href="shop.html" class="show-more-btn">Browse the Shop</a></p>
          </div>
        </div>`;
      return;
    }

    const rows = cart.map(item => {
      const metaParts = [item.category, item.size ? `Size ${item.size}` : null].filter(Boolean);
      const imgHTML = item.thumbnail
        ? `<img src="${item.thumbnail}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--radius);">`
        : `<div class="pixel-art-slot"><span>pixel art</span></div>`;
      const productHref = `product.html?id=${encodeURIComponent(item.productId || item.id)}`;
      return `
      <div class="cart-item-row" data-id="${item.id}">
        <a href="${productHref}" class="cart-item-thumb">
          <div class="product-card">
            <div class="product-price">$${item.price.toFixed(2)}</div>
            ${imgHTML}
          </div>
        </a>
        <div class="cart-item-info">
          <a href="${productHref}" class="cart-item-name">${item.name}</a>
          ${metaParts.length ? `<span class="cart-item-meta">${metaParts.join(' · ')}</span>` : ''}
        </div>
        <div class="cart-item-qty">
          <button class="cart-qty-btn" data-action="minus" data-id="${item.id}" aria-label="Decrease quantity">−</button>
          <span class="cart-qty-val">${item.qty}</span>
          <button class="cart-qty-btn" data-action="plus" data-id="${item.id}" aria-label="Increase quantity">+</button>
        </div>
      </div>`;
    }).join('');

    const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const shipping = SHIPPING_FLAT_FEE;
    const tax      = subtotal * TAX_RATE;
    const total    = subtotal + shipping + tax;

    app.innerHTML = `
      <div class="panel" id="order-summary-panel">
        <div class="panel-title"><img src="images/icon-cart.webp" alt="" class="panel-icon"> Order Summary</div>
        <div class="panel-body">
          <div class="cart-items-list">${rows}</div>
          <div class="cart-summary-row">
            <span>SUBTOTAL</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div class="cart-summary-row">
            <span>SHIPPING</span>
            <span>$${shipping.toFixed(2)}</span>
          </div>
          <div class="cart-summary-row">
            <span>TAX</span>
            <span>$${tax.toFixed(2)}</span>
          </div>
          <div class="cart-total-row">
            <span>TOTAL</span>
            <span>$${total.toFixed(2)}</span>
          </div>
        </div>
      </div>`;
  }

  // main.js's own document-level click listener updates the stored cart
  // and the sidebar mini-panel first (it's attached earlier in page load),
  // so by the time this fires, re-rendering here just reflects that change.
  document.addEventListener('click', function (e) {
    if (e.target.closest('.cart-qty-btn')) {
      render();
      scheduleRefreshPaymentIntent();
    }
  });

  render();

  // ── Stripe Elements wiring ──────────────────────────────
  // CHANGE THESE TWO VALUES:
  const STRIPE_PUBLISHABLE_KEY = 'pk_test_51TulgoGwi2Y6ihLxPs2vSSMm4Pt6zhBNsUYEVDNKR0qW9SBlVoRcZhnYGxWT8mrkr84EgWVaFqTG4hk4Vyp83jdb00uRJUN1rQ';
  const CREATE_INTENT_URL      = 'https://mags-marietta.vercel.app/api/create-payment-intent';

  const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
  let elements     = null;
  let refreshTimer = null;

  const orderPanel   = document.getElementById('complete-order-panel');
  const paymentForm  = document.getElementById('payment-form');
  const paymentMsg   = document.getElementById('payment-message');
  const submitBtn    = document.getElementById('submit-payment-btn');
  const submitBtnTxt = document.getElementById('submit-btn-text');

  function setSubmitting(isSubmitting) {
    submitBtn.disabled = isSubmitting;
    submitBtnTxt.textContent = isSubmitting ? 'PROCESSING...' : 'PLACE ORDER';
  }

  // Debounced so rapid +/- clicks don't spam the API — waits for clicks to settle.
  function scheduleRefreshPaymentIntent() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refreshPaymentIntent, 500);
  }

  async function refreshPaymentIntent() {
    const cart = getCart();

    if (cart.length === 0) {
      orderPanel.style.display = 'none';
      return;
    }

    try {
      const res = await fetch(CREATE_INTENT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cart })
      });
      const data = await res.json();

      if (!res.ok) {
        paymentMsg.textContent = data.error || 'Could not load payment form.';
        orderPanel.style.display = '';
        return;
      }

      // Re-create Elements with the fresh clientSecret (amount may have changed)
      elements = stripe.elements({
        clientSecret: data.clientSecret,
        appearance: {
          theme: 'stripe',
          variables: {
            colorPrimary:    '#d365e4',
            colorBackground: '#fffffe',
            colorText:       '#2c2129',
            fontFamily:      "'04b03', monospace",
            borderRadius:    '4px'
          }
        }
      });

      const paymentElement = elements.create('payment');
      document.getElementById('payment-element').innerHTML = '';
      paymentElement.mount('#payment-element');

      paymentMsg.textContent = '';
      orderPanel.style.display = '';
    } catch (err) {
      console.error(err);
      paymentMsg.textContent = 'Could not load payment form. Please refresh and try again.';
      orderPanel.style.display = '';
    }
  }

  paymentForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!elements) return;

    setSubmitting(true);
    paymentMsg.textContent = '';

    const { error } = await stripe.confirmPayment({
      elements,
      confirmParams: {
        return_url: window.location.origin + '/order-submitted.html'
      },
      redirect: 'if_required' // stay on this page unless the bank requires extra verification
    });

    if (error) {
      paymentMsg.textContent = error.message || 'Payment failed. Please check your card details.';
      setSubmitting(false);
      return;
    }

    // Success and no redirect was needed — clear the cart and move on ourselves.
    saveCart([]);
    window.location.href = 'order-submitted.html';
  });

  refreshPaymentIntent();
})();
</script>
